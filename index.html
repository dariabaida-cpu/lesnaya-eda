<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лесная еда — раскладки</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C2416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лесная еда">
<link rel="apple-touch-icon" href="icon_recipe.png">

<style>
  :root {
    --bg: #2C2416;
    --surface: #3D3020;
    --surface2: #4A3A28;
    --parchment: #F5EDD6;
    --parchment-dim: #C8BA9A;
    --accent: #D4894A;
    --green: #7A9E7E;
    --green-dim: #5A7A5E;
    --border: #5A4A35;
    --text: #F5EDD6;
    --text-dim: #A89878;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.45rem;
    font-weight: normal;
    color: var(--parchment);
    letter-spacing: 0.03em;
  }

  header h1 span {
    color: var(--accent);
  }

  .people-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
  }

  .people-bar label {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .people-bar input[type=number] {
    width: 52px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--accent);
    color: var(--parchment);
    font-size: 1.3rem;
    font-family: Georgia, serif;
    text-align: center;
    outline: none;
    padding: 2px 4px;
    -moz-appearance: textfield;
  }
  .people-bar input[type=number]::-webkit-inner-spin-button,
  .people-bar input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .btn-num {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent);
    font-size: 1.1rem;
    width: 26px; height: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .btn-num:hover { background: var(--surface2); }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 62px);
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    width: 280px;
    min-width: 220px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .cat-block { margin-bottom: 4px; }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    cursor: pointer;
    user-select: none;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--green);
    font-weight: 600;
    transition: color 0.15s;
  }

  .cat-header:hover { color: var(--green-dim); }

  .cat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .cat-arrow {
    margin-left: auto;
    font-size: 0.7rem;
    transition: transform 0.2s;
    color: var(--text-dim);
  }

  .cat-block.open .cat-arrow { transform: rotate(90deg); }

  .dish-list {
    display: none;
    padding: 0 0 8px 0;
  }

  .cat-block.open .dish-list { display: block; }

  .dish-item {
    padding: 7px 16px 7px 28px;
    cursor: pointer;
    font-size: 0.88rem;
    color: var(--parchment-dim);
    transition: color 0.15s, background 0.15s;
    border-left: 2px solid transparent;
    line-height: 1.35;
  }

  .dish-item:hover {
    color: var(--parchment);
    background: rgba(212,137,74,0.08);
  }

  .dish-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(212,137,74,0.1);
  }

  /* ---- MAIN ---- */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
  }

  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    text-align: center;
    gap: 12px;
  }

  .empty-state .icon { font-size: 3rem; opacity: 0.4; }

  .empty-state p {
    font-family: Georgia, serif;
    font-size: 1.05rem;
    font-style: italic;
  }

  .recipe-view { display: none; }
  .recipe-view.visible { display: block; }

  .recipe-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .recipe-cat {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--green);
    margin-bottom: 8px;
  }

  .recipe-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2rem;
    font-weight: normal;
    color: var(--parchment);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .recipe-meta {
    display: flex;
    gap: 20px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .recipe-meta span { display: flex; align-items: center; gap: 5px; }

  /* ---- INGREDIENTS ---- */
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .ingredients-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    margin-bottom: 36px;
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .ing-row {
    display: contents;
  }

  .ing-name, .ing-qty {
    padding: 9px 16px;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .ing-row:last-child .ing-name,
  .ing-row:last-child .ing-qty {
    border-bottom: none;
  }

  .ing-name {
    color: var(--parchment);
  }

  .ing-qty {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    text-align: right;
    white-space: nowrap;
    border-left: 1px solid var(--border);
  }

  .ing-row:hover .ing-name,
  .ing-row:hover .ing-qty {
    background: rgba(255,255,255,0.03);
  }

  /* Total row */
  .ing-total .ing-name {
    font-weight: 600;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--surface2);
  }
  .ing-total .ing-qty {
    font-weight: 600;
    color: var(--parchment-dim);
    background: var(--surface2);
    font-size: 0.8rem;
  }

  /* ---- STEPS ---- */
  .steps-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .step {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .step-num {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: Georgia, serif;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }

  .step-text {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--parchment-dim);
    padding-top: 4px;
  }

  /* ---- QTY ANIMATION ---- */
  .qty-val {
    display: inline-block;
    transition: opacity 0.15s;
  }

  .qty-val.flash {
    opacity: 0.3;
  }

  /* ---- MOBILE ---- */
  .back-btn {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0;
    margin-bottom: 20px;
  }
  .back-btn::before { content: '← '; }

  @media (max-width: 640px) {
    header { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
    .people-bar { margin-left: 0; }

    .layout {
      flex-direction: column;
      height: auto;
      overflow: visible;
      min-height: calc(100vh - 56px);
    }

    .sidebar {
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: none;
      overflow-y: visible;
      padding: 8px 0 16px;
    }
    .sidebar.hidden { display: none; }

    .main {
      padding: 20px 16px;
      display: none;
    }
    .main.mobile-visible { display: block; }

    .recipe-title { font-size: 1.4rem; }
    .back-btn { display: flex; }
  }
</style>
</head>
<body>

<header>
  <h1>Лесная <span>еда</span></h1>
  <div class="people-bar">
    <label>Человек</label>
    <button class="btn-num" onclick="changePeople(-1)">−</button>
    <input type="number" id="people" value="10" min="1" max="999" oninput="updateQty()">
    <button class="btn-num" onclick="changePeople(1)">+</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="icon">🔥</div>
      <p>Выберите блюдо</p>
    </div>
    <button class="back-btn" id="backBtn" onclick="goBack()">К списку блюд</button>
    <div class="recipe-view" id="recipeView"></div>
  </main>
</div>

// ---- BUILD SIDEBAR ----
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  for (const [cat, data] of Object.entries(RECIPES)) {
    const block = document.createElement('div');
    block.className = 'cat-block open';

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `<span class="cat-dot" style="background:${data.color}"></span>${cat}<span class="cat-arrow">▶</span>`;
    header.onclick = () => block.classList.toggle('open');

    const list = document.createElement('div');
    list.className = 'dish-list';

    for (const dishName of Object.keys(data.dishes)) {
      const item = document.createElement('div');
      item.className = 'dish-item';
      item.textContent = dishName;
      item.dataset.cat = cat;
      item.dataset.dish = dishName;
      item.onclick = () => selectDish(cat, dishName, item);
      list.appendChild(item);
    }

    block.appendChild(header);
    block.appendChild(list);
    sidebar.appendChild(block);
  }
}

// ---- RENDER RECIPE ----
let currentDish = null;
let currentCat = null;

function isMobile() { return window.innerWidth <= 640; }

function selectDish(cat, dishName, el) {
  document.querySelectorAll('.dish-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  currentDish = dishName;
  currentCat = cat;

  document.getElementById('emptyState').style.display = 'none';
  const view = document.getElementById('recipeView');
  view.classList.add('visible');

  renderRecipe(cat, dishName);

  if (isMobile()) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.add('mobile-visible');
    document.getElementById('backBtn').style.display = 'flex';
    window.scrollTo(0, 0);
  }
}

function goBack() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('main').classList.remove('mobile-visible');
  document.getElementById('backBtn').style.display = 'none';
  window.scrollTo(0, 0);
}

function fmt(qty, n) {
  if (qty === null || qty === undefined) return '—';
  const val = qty * n;
  return val % 1 === 0 ? val.toString() : parseFloat(val.toFixed(1)).toString();
}

function renderRecipe(cat, dishName) {
  const data = RECIPES[cat].dishes[dishName];
  const n = parseInt(document.getElementById('people').value) || 1;
  const color = RECIPES[cat].color;

  const totalGrams = data.ingredients
    .filter(([,q]) => q !== null)
    .reduce((s, [,q]) => s + q * n, 0);

  let html = `
    <div class="recipe-header">
      <div class="recipe-cat" style="color:${color}">${cat}</div>
      <div class="recipe-title">${dishName}</div>
      <div class="recipe-meta">
        <span>👥 <span id="metaPeople">${n}</span> чел.</span>
        <span>⚖️ ~${Math.round(totalGrams)} г всего</span>
      </div>
    </div>

    <div class="section-title">Ингредиенты</div>
    <div class="ingredients-grid">
  `;

  for (const [name, qty, unit] of data.ingredients) {
    const qtyStr = fmt(qty, n);
    html += `
      <div class="ing-row">
        <div class="ing-name">${name}</div>
        <div class="ing-qty"><span class="qty-val">${qtyStr}</span>&thinsp;${unit !== '—' ? unit : '—'}</div>
      </div>
    `;
  }

  html += `
      <div class="ing-row ing-total">
        <div class="ing-name">Итого</div>
        <div class="ing-qty">~${Math.round(totalGrams)}&thinsp;г</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:8px">Приготовление</div>
    <div class="steps-list">
  `;

  data.steps.forEach((step, i) => {
    html += `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${step}</div>
      </div>
    `;
  });

  html += `</div>`;

  document.getElementById('recipeView').innerHTML = html;
}

function updateQty() {
  if (!currentDish || !currentCat) return;
  const n = parseInt(document.getElementById('people').value) || 1;
  const data = RECIPES[currentCat].dishes[currentDish];

  // Flash and update quantities
  const vals = document.querySelectorAll('.qty-val');
  vals.forEach(v => v.classList.add('flash'));

  setTimeout(() => {
    const ingRows = document.querySelectorAll('.ing-row:not(.ing-total)');
    ingRows.forEach((row, i) => {
      const [, qty] = data.ingredients[i];
      const qtyEl = row.querySelector('.qty-val');
      if (qtyEl) qtyEl.textContent = fmt(qty, n);
    });

    const totalGrams = data.ingredients
      .filter(([,q]) => q !== null)
      .reduce((s, [,q]) => s + q * n, 0);

    const totalRow = document.querySelector('.ing-total .ing-qty');
    if (totalRow) totalRow.textContent = `~${Math.round(totalGrams)}\u202Fг`;

    const metaPeople = document.getElementById('metaPeople');
    if (metaPeople) metaPeople.textContent = n;

    document.querySelectorAll('.qty-val').forEach(v => v.classList.remove('flash'));
  }, 120);
}

function changePeople(delta) {
  const inp = document.getElementById('people');
  const val = parseInt(inp.value) || 1;
  inp.value = Math.max(1, val + delta);
  updateQty();
}

buildSidebar();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
